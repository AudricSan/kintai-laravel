name: Bug Report
description: Report unexpected behavior or an error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out as precisely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem you ran into.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Contents of `storage/logs/` if available.
      render: text

  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 22.04, Windows 11, macOS 14
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: Database driver
      options:
        - SQLite
        - MySQL
    validations:
      required: true
