name: Feature Request
description: Propose a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check it's not already on the [Roadmap](../../README.md#roadmap).

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem does this feature solve? What's the use case?
      placeholder: "As a manager, I would like to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other approaches?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This feature fits the project's lightweight philosophy (no heavy framework dependency)
          required: true
