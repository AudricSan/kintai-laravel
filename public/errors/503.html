<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a5c8c">
<title>503 — Maintenance en cours — Kintai</title>
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: var(--color-bg, #f5f5f5);
    color: var(--color-text, #1c1c1c);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: var(--space-4, 1rem);
  }
  .error-box { max-width: 360px; }
  .error-box img {
    width: 140px; height: auto;
    margin: 0 auto var(--space-4, 1rem);
    display: block;
  }
  h1 { font-size: 1.25rem; margin: 0 0 var(--space-2, 0.5rem); }
  p { color: var(--color-text-muted, #666); margin: 0 0 var(--space-4, 1rem); }
  a.back {
    display: inline-block;
    border: none; border-radius: var(--radius-md, 8px);
    background: #1a5c8c; color: #fff;
    padding: 0.65rem 1.5rem; font-size: 1rem; font-weight: 600;
    text-decoration: none;
  }
  a.back:hover { background: #14465f; }
</style>
</head>
<body>
  <div class="error-box">
    <img src="../assets/img/mascot/http-error/503.png" alt="Foxy, la mascotte de Kintai">
    <h1>503 — Maintenance en cours</h1>
    <p>Site en maintenance. Réessayez plus tard.</p>
  </div>
</body>
</html>
