<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a5c8c">
<title>Hors ligne — Kintai</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: var(--color-bg, #f5f5f5);
    color: var(--color-text, #1c1c1c);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: var(--space-4, 1rem);
  }
  .offline-box { max-width: 360px; }
  .offline-icon {
    width: 64px; height: 64px; margin: 0 auto var(--space-4, 1rem);
    border-radius: 16px;
    background: #1a5c8c;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.75rem; font-weight: 700;
  }
  h1 { font-size: 1.25rem; margin: 0 0 var(--space-2, 0.5rem); }
  p { color: var(--color-text-muted, #666); margin: 0 0 var(--space-4, 1rem); }
  button {
    border: none; border-radius: var(--radius-md, 8px);
    background: #1a5c8c; color: #fff;
    padding: 0.65rem 1.5rem; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #14465f; }
</style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">K</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre le serveur Kintai. Vérifiez votre connexion — les pages et pointages déjà consultés restent disponibles.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
